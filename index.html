<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pralay Shamak</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero-container">
        <!-- Background Image Slider -->
        <div class="image-slider">
            <img src="https://i.ibb.co/q3835vZs/image.png" alt="Slide 1" class="slide active">
            <img src="https://i.ibb.co/d0rsbGFS/image.png" alt="Slide 2" class="slide">
            <img src="https://i.ibb.co/zYXfdCs/image.png" alt="Slide 3" class="slide">
            <img src="https://i.ibb.co/jZ6yLykZ/image.png" alt="Slide 4" class="slide">
            <img src="https://i.ibb.co/nqJLbmYz/image.png" alt="Slide 5" class="slide">
        </div>
        
        <!-- Gradient Overlay for Better Text Contrast -->
        <div class="hero-overlay"></div>
        
    
        <!-- Hero Content -->
        <div class="hero-content">
            <p class="hero-subtitle">Where Innovation Meets Safety !</p>
            <div class="hero-buttons">
                <button class="hero-btn">
                    <span>Explore Now</span>
                    <div class="btn-shine"></div>
                </button>
                <button class="hero-btn collaborate-btn">
                    <span>Contact Us</span>
                    <div class="btn-shine"></div>
                </button>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
